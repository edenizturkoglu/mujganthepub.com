# main dalına her push'ta siteyi derleyip GitHub Pages'e (mujganthepub.com) yayınlar.
name: Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Her pazartesi 06:00 (TR 09:00): etkinlik şeması ve site haritası tarihleri tazelensin
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
